name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      abi:
        description: APK ABI
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_ABI: ${{ inputs.abi || 'arm64-v8a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build one debug APK
        run: ./gradlew :app:packageDebug -PciAbi="$TARGET_ABI" --no-daemon

      - name: Stage the APK
        run: |
          mkdir -p artifact
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print | sort)

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK for $TARGET_ABI; found ${#apks[@]}:"
            printf '  %s\n' "${apks[@]}"
            exit 1
          fi

          cp "${apks[0]}" "artifact/NewBlackboxSocks-${TARGET_ABI}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewBlackboxSocks-${{ env.TARGET_ABI }}-debug
          path: artifact/NewBlackboxSocks-${{ env.TARGET_ABI }}-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
