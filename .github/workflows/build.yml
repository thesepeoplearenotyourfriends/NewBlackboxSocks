name: Build NewBlackboxSocks APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Build arm64 performance APK
        run: ./gradlew assemblePerformance -PciAbi=arm64-v8a --no-daemon

      - name: Find performance APK
        id: apk
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/performance -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one performance APK; found ${#apks[@]}:"
            printf '  %s\n' "${apks[@]}"
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload performance APK
        uses: actions/upload-artifact@v4
        with:
          name: NewBlackboxSocks-performance-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Prepare release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp "${{ steps.apk.outputs.path }}" NewBlackboxSocks.apk

      - name: Publish moving release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-newblackboxsocks >/dev/null 2>&1; then
            gh release create latest-newblackboxsocks \
              --title "Latest NewBlackboxSocks build" \
              --notes "This release is automatically updated with the latest successful NewBlackboxSocks performance build."
          fi
          gh release upload latest-newblackboxsocks \
            NewBlackboxSocks.apk \
            --clobber
          gh release edit latest-newblackboxsocks --latest
